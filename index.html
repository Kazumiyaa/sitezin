<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Entrada para o cantinho pessoal de Kazumiya."
  >
  <title>Zumi World — entrar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="intro.css">
</head>

<body>
  <video
    class="intro-video"
    autoplay
    muted
    loop
    playsinline
    preload="metadata"
    poster="assets/intro-poster.png"
    aria-hidden="true"
  >
    <source src="assets/intro-bg.mp4" type="video/mp4">
  </video>
  <div class="intro-vignette" aria-hidden="true"></div>
  <div class="intro-grain" aria-hidden="true"></div>
  <div class="intro-particles" id="intro-particles" aria-hidden="true"></div>

  <main class="intro-shell">
    <section class="intro-card">
      <p class="intro-kicker">SEJA BEM-VINDO(A) AO MEU CANTINHO ✦</p>

      <h1>
        Zumi <span>World</span>
      </h1>

      <p class="intro-text">
        Seja bem-vindo(a) ao meu cantinho.<br>
        Pelo menos me deixe sonhar um pouco ♡
      </p>

      <a class="enter-button" href="home.html">
        <span>Aperta logo</span>
        <b>→</b>
      </a>

      <p class="intro-note">
        Você parece triste.
      </p>
    </section>

    <div class="corner-text corner-left">01 — zumi world</div>
    <div class="corner-text corner-right">sonhos • caos • ursinhos</div>
  </main>

  <script src="intro.js"></script>
</body>
</html>
